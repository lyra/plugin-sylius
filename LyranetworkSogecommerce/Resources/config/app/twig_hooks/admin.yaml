sylius_twig_hooks:
  hooks:
    base_sogecommerce_fields: &sogecommerce_fields
      sogecommerce_rest_api_widget:
          template: '@LyranetworkSogecommercePlugin/admin/payment_method/form/sogecommerce_rest_api_widget.html.twig'
          priority: 0
      sogecommerce_rest_api_check_url:
        template: '@LyranetworkSogecommercePlugin/admin/payment_method/form/sogecommerce_rest_api_check_url.html.twig'
        priority: 0

    'sylius_admin.payment_method.create.content.form.sections.gateway_configuration.sogecommerce_sylius_payment':
      <<: *sogecommerce_fields

    'sylius_admin.payment_method.update.content.form.sections.gateway_configuration.sogecommerce_sylius_payment':
      <<: *sogecommerce_fields

    'sylius_admin.order.show.content.sections.payments.item':
      name:
        template: '@LyranetworkSogecommercePlugin/admin/order/payment_details.html.twig'
        priority: 150
    'sylius_admin.payment_method.create.content.form.sections':
      general:
        template: '@LyranetworkSogecommercePlugin/admin/payment_method/general.html.twig'
        priority: 150
    'sylius_admin.payment_method.update.content.form.sections':
      general:
        template: '@LyranetworkSogecommercePlugin/admin/payment_method/general.html.twig'
        priority: 150