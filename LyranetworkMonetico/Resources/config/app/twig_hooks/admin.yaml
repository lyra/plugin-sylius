sylius_twig_hooks:
  hooks:
    base_monetico_fields: &monetico_fields
      monetico_rest_api_widget:
          template: '@LyranetworkMoneticoPlugin/admin/payment_method/form/monetico_rest_api_widget.html.twig'
          priority: 0
      monetico_rest_api_check_url:
        template: '@LyranetworkMoneticoPlugin/admin/payment_method/form/monetico_rest_api_check_url.html.twig'
        priority: 0

    'sylius_admin.payment_method.create.content.form.sections.gateway_configuration.monetico_sylius_payment':
      <<: *monetico_fields

    'sylius_admin.payment_method.update.content.form.sections.gateway_configuration.monetico_sylius_payment':
      <<: *monetico_fields

    'sylius_admin.order.show.content.sections.payments.item':
      name:
        template: '@LyranetworkMoneticoPlugin/admin/order/payment_details.html.twig'
        priority: 150
    'sylius_admin.payment_method.create.content.form.sections':
      general:
        template: '@LyranetworkMoneticoPlugin/admin/payment_method/general.html.twig'
        priority: 150
    'sylius_admin.payment_method.update.content.form.sections':
      general:
        template: '@LyranetworkMoneticoPlugin/admin/payment_method/general.html.twig'
        priority: 150