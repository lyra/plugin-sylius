payzen_sylius_account_customer_wallet:
  path: /{_locale}/payzen/account/customer-wallet
  methods: [POST, GET]
  defaults:
    _controller: 'Lyranetwork\Payzen\Controller\CustomerWalletController::savedCardsAction'

payzen_rest_configuration_widget_token:
  path: /payzen/rest/configuration/widget-token
  methods: [POST]
  defaults:
    _controller: 'Lyranetwork\Payzen\Controller\RestConfigurationController::getWidgetToken'

payzen_rest_configuration_default_form_configuration:
  path: /payzen/rest/configuration/default-config
  methods: [GET]
  defaults:
    _controller: 'Lyranetwork\Payzen\Controller\RestConfigurationController::getDefaultConfiguration'
