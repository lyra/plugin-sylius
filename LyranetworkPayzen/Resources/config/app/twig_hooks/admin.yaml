sylius_twig_hooks:
  hooks:
    base_payzen_fields: &payzen_fields
      payzen_rest_api_widget:
          template: '@LyranetworkPayzenPlugin/admin/payment_method/form/payzen_rest_api_widget.html.twig'
          priority: 0
      payzen_rest_api_check_url:
        template: '@LyranetworkPayzenPlugin/admin/payment_method/form/payzen_rest_api_check_url.html.twig'
        priority: 0

    'sylius_admin.payment_method.create.content.form.sections.gateway_configuration.payzen_sylius_payment':
      <<: *payzen_fields

    'sylius_admin.payment_method.update.content.form.sections.gateway_configuration.payzen_sylius_payment':
      <<: *payzen_fields

    'sylius_admin.order.show.content.sections.payments.item':
      name:
        template: '@LyranetworkPayzenPlugin/admin/order/payment_details.html.twig'
        priority: 150
    'sylius_admin.payment_method.create.content.form.sections':
      general:
        template: '@LyranetworkPayzenPlugin/admin/payment_method/general.html.twig'
        priority: 150
    'sylius_admin.payment_method.update.content.form.sections':
      general:
        template: '@LyranetworkPayzenPlugin/admin/payment_method/general.html.twig'
        priority: 150